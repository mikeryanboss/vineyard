name: Auto Tag

# A push to main that changes what goes into the binary releases the next
# patch version.
on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "!**_test.go"
      - "!**/testdata/**"
      - go.mod
      - go.sum
      - internal/config/templates/**

permissions:
  contents: write

# One run at a time, so each numbers its tag after the one before.
concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the next patch version
        id: tag
        run: |
          tagged=$(git tag --points-at HEAD --list 'v*')
          if [ -n "$tagged" ]; then
            echo "HEAD is already tagged $tagged"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          IFS=. read -r major minor patch <<< "${latest#v}"
          next="v$major.$minor.$((patch + 1))"
          git tag "$next"
          git push origin "$next"
          echo "created=true" >> "$GITHUB_OUTPUT"

  # A tag pushed with GITHUB_TOKEN starts no workflow, so call the release here.
  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
