default_program = 'claude'
branch_prefix = 'mboss/'
auto_yes = false
worktree_dir = '.vineyard/worktrees'
diff_command = 'hunk diff {base} --watch'
multiplexer = 'vineyard'
status_bar = true

[[profiles]]
name = 'agy'
program = 'agy --dangerously-skip-permissions'

[[profiles]]
name = 'agy-no-worktree'
program = 'agy --dangerously-skip-permissions'
main_checkout = true
